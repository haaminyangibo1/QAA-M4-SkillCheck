server {
    listen 80;

    # Serve the static website (index.html and index.js)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: the browser asks nginx for /colour, and nginx forwards it
    # to the backend. "backend" is resolved by DNS:
    #   - locally: the name of the backend container on the shared Docker network
    #   - in Kubernetes: the name of the backend ClusterIP Service
    location /colour {
        proxy_pass http://backend:5000/colour;
    }
}
